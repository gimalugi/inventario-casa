name: "Inventario Casa"
version: "2.5.0"
slug: "inventario_casa"
description: "Inventario domestico modulare per oggetti, posizioni, foto e tipologie personalizzabili"
arch:
  - amd64
  - aarch64
  - armv7
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: "mdi:archive-search"
panel_title: "Inventario Casa"
panel_admin: false
backup: cold
map:
  - type: media
    read_only: false
options:
  default_language: "it"
  backup_keep_manual: 10
  backup_keep_pre_restore: 5
  backup_keep_pre_schema: 5

schema:
  default_language: "list(it|en)"
  backup_keep_manual: "int(1,100)"
  backup_keep_pre_restore: "int(1,100)"
  backup_keep_pre_schema: "int(1,100)"
